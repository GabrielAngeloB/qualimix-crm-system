name: Supabase keepalive

on:
  schedule:
    # A cada três dias, às 12:00 UTC.
    - cron: "0 12 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call harmless Supabase health-check RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Configure os secrets SUPABASE_URL e SUPABASE_ANON_KEY no GitHub."
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 20 \
            "${SUPABASE_URL}/rest/v1/rpc/keepalive" \
            --request POST \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}'

          echo "Supabase keepalive concluído."
