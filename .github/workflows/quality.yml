name: CRM quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: ESLint, unit tests, TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: ESLint (excluding repository-wide formatting debt)
        run: "bunx eslint . --rule 'prettier/prettier: 0'"
      - name: Unit tests
        run: bun run test
      - name: Production build (also regenerates TanStack routes)
        run: bun run build
      - name: TypeScript check
        run: bunx tsc --noEmit
