name: CRM quality checks

on:
  push:
    branches: [main, feat/supabase-auth-database]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: ESLint, unit tests, TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint (excluding repository-wide formatting debt)
        run: pnpm exec eslint . --rule 'prettier/prettier: 0'
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
